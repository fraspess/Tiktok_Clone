events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name tiktok-clone-demo.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name tiktok-clone.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/tiktok-clone-demo.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tiktok-clone-demo.duckdns.org/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            resolver 127.0.0.11 valid=30s;
            set $upstream http://api:8080;
            proxy_pass $upstream;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            client_max_body_size 500M;
            proxy_request_buffering off;
        }

        location /hubs/ {
            resolver 127.0.0.11 valid=30s;
            set $upstream http://api:8080;
            proxy_pass $upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
