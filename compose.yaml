services:
    frontend:
        build:
          context: front/
          args:
            VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            api:
                condition: service_healthy
        networks:
            - tiktok_network
        volumes:
            - ./certbot/conf:/etc/letsencrypt:ro
            - ./certbot/www:/var/www/certbot:ro

    db:
        image: postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        expose:
          - "5432"
        volumes:
            - db:/var/lib/postgresql
        networks:
            - tiktok_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
    api:
        build:
            context: back/
            dockerfile: .dockerfile
        container_name: api
        environment:
            ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
            RabbitMQ__HostName: "rabbitMQ"
            RabbitMQ__UserName: ${RABBITMQ_USERNAME}
            RabbitMQ__Password: ${RABBITMQ_PASSWORD}
            Jwt__Key: ${JWT_KEY}
            Google__ClientId: ${GOOGLE_CLIENT_ID}
            Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
            SMTP__Password: ${SMTP_PASSWORD}
            AWS__S3__AccessKey: ${AWS_S3_ACCESS_KEY}
            AWS__S3__SecretKey: ${AWS_S3_SECRET_KEY}
            Redis__ConnectionString: "redis:6379, password=${REDIS_PASSWORD}" 
        expose: 
            - "8080"
        volumes:
            - api_logs:/app/logs
            - api_temp:/app/temp
        networks:
            - tiktok_network
        depends_on:
            db:
                condition: service_healthy
            rabbitMQ:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        restart: unless-stopped
    video_processor:
        build:
            context: back/
            dockerfile: VideoProcessor/.dockerfile
        container_name: video_processor
        environment:
            RabbitMQ__HostName: "rabbitMQ"
            RabbitMQ__UserName: ${RABBITMQ_USERNAME}
            RabbitMQ__Password: ${RABBITMQ_PASSWORD}
        networks:
            - tiktok_network
        volumes:
            - api_temp:/app/temp
            - api_uploads:/app/uploads
        depends_on:
            db: 
                condition: service_healthy
            rabbitMQ:
                condition: service_healthy
        # deploy:
        #     resources:
        #         limits:
        #             cpus: "0.5"
        #             memory: 400m
        restart: unless-stopped

    rabbitMQ:
        image: rabbitmq:3-management
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - tiktok_network
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    redis:
      image: redis:latest
      command: redis-server --requirepass ${REDIS_PASSWORD}
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5
      volumes:
        - redis_data:/data
      expose: 
        - "6379"
      networks:
        - tiktok_network
      restart: unless-stopped

    db-backup:
      image: postgres
      container_name: db-backup
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - db:/var/lib/postgresql
        - ./backups:/backups
      networks:
        - tiktok_network
      depends_on:
        db:
          condition: service_healthy
      entrypoint: >
        sh -c "
          while true; do
            TIMESTAMP=$$(date +'%Y%m%d%H%M%S')
            pg_dump -h db -U ${POSTGRES_USER} ${POSTGRES_DB} | gzip > /backups/db_$$TIMESTAMP.sql.gz
          
            sleep 86400
          done
        " 

networks:
    tiktok_network:
        name: "tiktok_network"

volumes:
    db:
        driver: local
        name: "db"
    api_uploads:
        driver: local
        name: "api_uploads"
    api_temp:
        driver: local
        name: "api_temp"
    api_images:
        driver: local
        name: "api_images"
    rabbitmq_data:
        driver: local
        name: "rabbitmq_data"
    api_logs:
        driver: local
        name: "api_logs"
    redis_data:
      driver: local
      name: "redis_data"
  
